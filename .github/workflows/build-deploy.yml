name: Build data and deploy
# Every Monday 03:23 SAST (and on demand): fetch every source again, rebuild tiles and dossiers, build the site,
# deploy it to Cloudflare Pages. Nothing is deployed if any step fails, so the live site keeps the last good data.
on:
  schedule:
    - cron: "23 1 * * 1"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["src/**", "index.html", "public/**", "pipeline/**", "package.json"]
concurrency: { group: deploy, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install shapely pmtiles
      - run: npm ci
      - name: Fetch and build data
        run: npm run data:refresh
      - name: Build site
        run: npm run build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        # the account is found from the token itself (the token belongs to one account)
        with:
          apiToken: ${{ secrets.CLOUDFARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          preCommands: npx wrangler pages project create cape-monitor --production-branch=main || true
          command: pages deploy dist --project-name=cape-monitor --branch=main

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cape Monitor · Blaauwberg pilot</title>
<meta name="description" content="Cape Monitor: an intelligence desk for the City of Cape Town. Every City record, plot by plot, with service requests, building plans, City spending, safety, infrastructure, heritage and news.">
<meta property="og:title" content="Cape Monitor">
<meta property="og:description" content="Tap any plot in Blaauwberg and see everything the City and other public sources hold on it.">
<meta name="theme-color" content="#0b0f12">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
<header id="top">
  <button class="tb" id="menu" aria-label="Layers">☰</button>
  <div class="brand"><span class="dot"></span>CAPE MONITOR</div>
  <div class="chip" id="district" title="Planning district shown">—</div>
  <div class="search"><input id="q" type="search" autocomplete="off" spellcheck="false"><div id="results" hidden></div></div>
  <div class="clock" id="clock" title="South African time"></div>
  <div class="fresh" id="fresh"></div>
  <div class="seg" id="base"><button data-base="map" aria-pressed="true">Map</button><button data-base="sat" aria-pressed="false">Satellite</button></div>
  <button class="tb" id="lang">AF</button>
  <button class="tb" id="install" hidden>Install</button>
</header>
<aside id="left" class="panel"></aside>
<main id="mapwrap"><div id="map"></div><div id="hud"></div><div id="legend"></div></main>
<aside id="right" class="panel"></aside>
<button id="closeinspect" class="tb" aria-label="Close">✕</button>
<section id="dock">
  <nav id="tabs"></nav>
  <div id="dockbody"></div>
</section>
<div id="toast" hidden></div>
<div id="boot"><div class="brand big"><span class="dot"></span>CAPE MONITOR</div><div id="bootmsg">Loading…</div></div>
<script type="module" src="./src/main.ts"></script>
</body>
</html>
